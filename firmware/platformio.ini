; DeskPet · firmware de la ESP32-C3 SuperMini
;
; Dos entornos con el mismo código:
;   deskpet  → el robot de verdad (pantalla redonda GC9A01)
;   wokwi    → el simulador Wokwi (ILI9341, porque Wokwi no tiene GC9A01)

[platformio]
default_envs = deskpet

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit GFX Library

[env:deskpet]
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit GC9A01A
build_flags =
    ; La SuperMini no tiene chip USB-serie: el monitor serie va por el USB de la C3
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:wokwi]
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit ILI9341
build_flags =
    -D PANTALLA_WOKWI
    -D MODO_PRUEBA
