; DeskPet · firmware de la ESP32-C3 SuperMini
;
; Todos los robots comparten el código de src/. Lo que cambia es la cara,
; que está en robots/<nombre>.h. Cada robot tiene dos entornos:
;   <nombre>        → el robot de verdad (pantalla redonda GC9A01)
;   wokwi-<nombre>  → el simulador Wokwi (ILI9341, porque Wokwi no tiene GC9A01)
;
; Para crear un robot nuevo: copia un archivo de robots/, cámbialo y añade
; aquí sus dos entornos copiando los de otro robot.

[platformio]
default_envs = mochi

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit GFX Library

[robot]
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit GC9A01A
build_flags =
    -I robots
    ; La SuperMini no tiene chip USB-serie: el monitor serie va por el USB de la C3
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

[simulador]
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit ILI9341
; Copia el firmware a .pio/build/wokwi, que es lo que abre wokwi.toml
extra_scripts = post:scripts/copiar_wokwi.py
build_flags =
    -I robots
    -D PANTALLA_WOKWI
    -D MODO_PRUEBA
    ; Muestra todas las caras seguidas (bórralo para probar los sensores)
    -D MODO_DEMO

; ---------------------------------------------------------------- Robots

[env:mochi]
extends = robot
build_flags = ${robot.build_flags} -D ROBOT=\"mochi.h\"

[env:wokwi-mochi]
extends = simulador
build_flags = ${simulador.build_flags} -D ROBOT=\"mochi.h\"

[env:malvado]
extends = robot
build_flags = ${robot.build_flags} -D ROBOT=\"malvado.h\"

[env:wokwi-malvado]
extends = simulador
build_flags = ${simulador.build_flags} -D ROBOT=\"malvado.h\"

[env:clasico]
extends = robot
build_flags = ${robot.build_flags} -D ROBOT=\"clasico.h\"

[env:wokwi-clasico]
extends = simulador
build_flags = ${simulador.build_flags} -D ROBOT=\"clasico.h\"

[env:upir]
extends = robot
build_flags = ${robot.build_flags} -D ROBOT=\"upir.h\"

[env:wokwi-upir]
extends = simulador
build_flags = ${simulador.build_flags} -D ROBOT=\"upir.h\"
